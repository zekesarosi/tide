name: CI

on:
  push:
  pull_request:

jobs:
  tidekit-linux:
    name: TideKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path TideKit

  ios-app:
    name: iOS app build + TideKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app for iOS Simulator
        run: |
          xcodebuild -project TideForecast.xcodeproj -scheme TideForecast \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: TideKit tests
        run: swift test --package-path TideKit
