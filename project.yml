# XcodeGen spec — generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
name: TideForecast
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TideKit:
    path: TideKit
targets:
  TideForecast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: TideKit
        product: TideKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tide & Surge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Your location is used only on this device to list the nearest tide stations.
        ITSAppUsesNonExemptEncryption: false
        # Injected from Config/App.xcconfig (+ optional Config/Secrets.xcconfig).
        TideAppName: $(TIDE_APP_NAME)
        TideContact: $(TIDE_CONTACT)
        TideOpenMeteoAPIKey: $(OPEN_METEO_API_KEY)
        TideAdmiraltyKey: $(UK_ADMIRALTY_KEY)
    settings:
      base:
        PRODUCT_NAME: TideForecast
        PRODUCT_BUNDLE_IDENTIFIER: $(TIDE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  TideForecast:
    build:
      targets:
        TideForecast: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: TideKit/TideKitTests
    archive:
      config: Release
